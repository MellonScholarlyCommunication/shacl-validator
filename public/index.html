<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHACL Validator</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="css/main.css">
  <script src="/env-config.js"></script>
</head>
<body>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h2 class="h5 mb-0" id="app-title"></h2>
            <small id="app-name"></small>
          </div>
          
          <div class="card-body">
            <div class="mb-4">
              <label for="filePicker" class="form-label fw-bold">Step 1: Upload a File</label>
              <input class="form-control" type="file" id="filePicker" accept=".jsonld,.json,.ttl,.nt">
            </div>

            <hr class="my-4">

            <div class="mb-3">
              <label class="form-label fw-bold">Step 2: Review or Paste Data</label>
              <div class="editor-wrapper">
                <textarea id="input" spellcheck="false" placeholder="Paste JSON-LD here..."></textarea>
                <pre id="highlighting" aria-hidden="true"><code class="language-json" id="highlighting-content"></code></pre>
              </div>
            </div>

            <div class="d-flex gap-2 mb-4">
              <button id="send" class="btn btn-success px-4">Validate Now</button>
              <button id="clear" class="btn btn-outline-secondary">Clear All</button>
            </div>

            <div class="mt-4">
              <label class="form-label fw-bold">Results</label>
              <div id="output" class="p-3 border rounded bg-light text-muted">Results will appear here...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>

  <script src="js/main.js"></script>
</body>
</html>
